appId: com.bid-workshop.desktop
productName: Bid Workshop
copyright: Copyright 2026 Bid Workshop Team
electronVersion: 37.10.3

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  # The pnpm collector drops this nested version in the hoisted layout.
  # Keep retry 0.12 for Pi's lockfile code; other consumers require root 0.13.
  - from: ../../node_modules/proper-lockfile/node_modules/retry
    to: node_modules/proper-lockfile/node_modules/retry
    filter:
      - "**/*"
  # The collector nests the newer SSO under Bedrock. Its token provider must
  # stay below SSO: Bedrock itself pins a different token-provider version.
  - from: ../../node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    to: node_modules/@aws-sdk/client-bedrock-runtime/node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    filter:
      - "**/*"

extraResources:
  - from: resources/icon.png
    to: icon.png
  # The hosted document editor renderer is served from disk at run time.
  - from: ../../packages/document-editor/dist
    to: document-editor/dist
    filter:
      - "**/*"

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/.pnpm/node-pty*/node_modules/node-pty/**/*"

# Artifact names stay lower-case and hyphenated: `productName` is the display
# name the .app takes, and a space in it would land in every file name.
artifactName: bid-workshop-${version}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  # Notarization needs Apple credentials this project does not have. The app
  # still builds and runs unsigned; re-enable this together with the credentials.
  notarize: false
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  darkModeSupport: true
  extraFiles:
    - from: build/native/bid-workshop-notification-status-helper
      to: MacOS/bid-workshop-notification-status-helper

linux:
  category: Development
  executableName: bid-workshop
  maintainer: Bid Workshop Team <smart-kind@users.noreply.github.com>
  vendor: Bid Workshop
  synopsis: Desktop workbench for AI-assisted document review
  description: A desktop workbench for AI agent sessions, workspaces, and Word document review.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

deb:
  artifactName: bid-workshop_${version}_${arch}.${ext}
  packageName: bid-workshop
  packageCategory: devel
  priority: optional
  afterRemove: resources/linux/after-remove.sh
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
    - libgbm1

win:
  executableName: bid-workshop
  # Keep icon/version metadata editing; signing is optional without credentials.
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: bid-workshop-${version}-${arch}-setup.${ext}

portable:
  artifactName: bid-workshop-${version}-${arch}-portable.${ext}

toolsets:
  appimage: "1.0.2"

dmg:
  # Signing the disk image needs a Developer ID this project does not have.
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

publish:
  provider: github
  owner: smart-kind
  repo: bid-workshop
